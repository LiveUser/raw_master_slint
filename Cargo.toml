[package]
name = "slint-rust-template"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.19.0"
dart_io = "0.1.1"
objective_db = "0.0.2"
easy_bson = "0.1.3"
power_plant = "0.1.1"
jixel = "0.5.10"
oximedia-lut = "0.2.1"
rawler = "0.8.0"
rfd = "0.18.0"

[build-dependencies]
slint-build = "1.19.0"

[profile.release]
codegen-units = 1
lto = true

[package.metadata.packager]
product-name = "Raw Master"
identifier = "com.rawware.raw_master"
formats = ["appimage"]
icons = ["icons/icon.png"]
before-packaging-command = "cargo build --release"
